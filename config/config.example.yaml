# Copy this file to config.yaml and fill in real values.
# config.yaml is gitignored -- never commit real API keys.

sensor_backend: mock   # "mock" or "real" -- config/loader.py validates this,
                        # poller.py uses it to decide which SensorReader to instantiate

poll_interval_seconds: 60

storage:
  db_path: "frost_edge.db"

mock:
  csv_path: null        # e.g. "data/sample_readings.csv" -- null means synthetic fallback
  loop: true

alerts:
  cooldown_minutes: 30
  risk_threshold: 0.6

telegram: {}  #<-- present on .env

sms: {}     # Fast2SMS (optional): FAST2SMS_API_KEY, SMS_TO_NUMBER come from .env
twilio: {}  # Twilio: TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, TWILIO_FROM_NUMBER, TWILIO_TO_NUMBER come from .env

alerts:
  cooldown_minutes: 30
  risk_threshold: 0.6
  hysteresis_margin: 0.1
  channels: [console]